name: Weekly Scraper

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  scrape_fotmob:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t fotmob-scraper .

      - name: Run FotMob Scraper
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          docker run --rm \
            --shm-size=2g \
            -e DB_URL \
            fotmob-scraper

  scrape_sofascore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jupyter nbconvert cloudscraper

      - name: Run SofaScore notebook
        env:
          DB_URL: ${{ secrets.DB_URL }}
        working-directory: scrapers
        run: |
          jupyter nbconvert --to notebook --execute --inplace run_scraper_sofascore.ipynb