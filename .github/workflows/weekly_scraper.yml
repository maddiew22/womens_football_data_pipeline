name: Weekly FotMob Scraper

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fotmob-scraper .

      - name: Run scraper
        run: docker run fotmob-scraper